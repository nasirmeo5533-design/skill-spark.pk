<section class="section impact" id="impact">
  <div class="container">
    <div class="impact__inner">

      <div class="section-head section-head--center" data-reveal>
        <span class="eyebrow">The Track Record</span>
        <h2 class="section-title">Proof over <span class="grad">promises.</span></h2>
        <p class="section-sub">Numbers from the stores already running on the system.</p>
      </div>

      <div class="impact__grid">
        <div class="stat impact__stat d-1" data-reveal>
          <div class="stat__number"><span data-count="8" data-suffix="+">0</span></div>
          <div class="stat__label">Active clients</div>
        </div>
        <div class="stat impact__stat d-2" data-reveal>
          <div class="stat__number"><span data-count="50" data-suffix="+">0</span></div>
          <div class="stat__label">Projects delivered</div>
        </div>
        <div class="stat impact__stat d-3" data-reveal>
          <div class="stat__number"><span data-count="6">0</span></div>
          <div class="stat__label">Specialists</div>
        </div>
        <div class="stat impact__stat d-4" data-reveal>
          <div class="stat__number"><span data-count="3" data-suffix="+">0</span></div>
          <div class="stat__label">Industries automated</div>
        </div>
      </div>

    </div>
  </div>
</section>
